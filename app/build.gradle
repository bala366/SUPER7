plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.supersete.talov2'
    compileSdk 35

    defaultConfig {
        applicationId 'com.supersete.talov2'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '2.2'

        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }

        python {
            version '3.11'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

chaquopy {
    defaultConfig {
        version = "3.11"
    }
}
