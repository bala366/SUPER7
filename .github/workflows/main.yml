name: Compilar APK Super Sete Talo V2

on:
  workflow_dispatch:

jobs:
  build:
    name: Gerar APK Super Sete Talo V2
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto do GitHub
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android SDK 35
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Conferir estrutura do projeto
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/supersete/talov2/MainActivity.java
          test -f app/src/main/python/motor_super_sete_v2.py
          echo "ESTRUTURA OK"

      - name: Conferir Chaquopy e arquiteturas
        run: |
          grep -q "abiFilters" app/build.gradle
          grep -q "arm64-v8a" app/build.gradle
          echo "CHAQUOPY / ABI OK"

      - name: Testar motor Python antes do APK
        run: |
          python -m py_compile app/src/main/python/motor_super_sete_v2.py
          echo "MOTOR PYTHON SEM ERRO DE SINTAXE"

      - name: Compilar APK
        run: |
          gradle :app:assembleDebug --stacktrace

      - name: Verificar APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERRO: APK NAO FOI GERADO"
            exit 1
          fi

          echo "APK GERADO COM SUCESSO"
          ls -lh "$APK"

      - name: Publicar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: SUPER-SETE-TALO-V2-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
